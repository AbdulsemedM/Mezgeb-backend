services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mezgeb
      POSTGRES_PASSWORD: mezgeb
      POSTGRES_DB: mezgeb
    ports:
      - '55432:5432' # host 55432 avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mezgeb -d mezgeb']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mezgeb
      MINIO_ROOT_PASSWORD: mezgeb-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Creates the dev bucket. The server image ships the mc client (minio/mc is no longer published).
  minio-init:
    image: minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mezgeb mezgeb-dev-secret &&
      mc mb --ignore-existing local/mezgeb-dev
      "

volumes:
  pgdata:
  miniodata:
