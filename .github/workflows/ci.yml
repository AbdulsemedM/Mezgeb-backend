name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrations match the Drizzle schema
        run: |
          pnpm --filter @mezgeb/api db:generate
          git diff --exit-code -- apps/api/drizzle
          test -z "$(git status --porcelain -- apps/api/drizzle)"
      # Integration tests start Postgres via Testcontainers using the runner's Docker.
      - run: pnpm test
